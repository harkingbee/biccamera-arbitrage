name: Accuracy Monitor
on:
  schedule: [{cron: '0 22 * * *'}] # JST 07:00
  workflow_dispatch:
jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - run: pip install -r yahoo_mercari_arbitrage/requirements.txt && pip install scikit-learn
      - run: python -m yahoo_mercari_arbitrage.arbitrage_accuracy_tfidf
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/accuracy_*.csv
          git diff --staged --quiet || git commit -m "chore: accuracy TF-IDF $(date +%Y-%m-%d)"
          git push || true
